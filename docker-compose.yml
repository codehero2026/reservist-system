version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: reservist_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reservist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reservist_pass}
      POSTGRES_DB: ${POSTGRES_DB:-reservist_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reservist}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reservist_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reservist_api
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reservist_web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
